name: CI
on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main, cursor/**]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        # version comes from "packageManager" in package.json (pnpm@10.13.1)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Fixture E2E scaffold
        run: |
          set -euo pipefail
          test -d testdata/fixtures/minimal-node-repo
          # E2E will use built axictx against testdata/fixtures/minimal-node-repo
          BIN="packages/cli/dist/axictx-cli.js"
          if [ ! -f "$BIN" ]; then
            echo "Built axictx bin not found at $BIN; skipping fixture E2E."
            exit 0
          fi
          FIXTURE_COPY="$(mktemp -d)"
          cp -R testdata/fixtures/minimal-node-repo/. "$FIXTURE_COPY"/
          (
            cd "$FIXTURE_COPY"
            git init -q .
            git add -A
            git -c user.email="ci@latticeag.dev" -c user.name="CI" commit -qm "seed fixture"
            node "$GITHUB_WORKSPACE/$BIN" init
            node "$GITHUB_WORKSPACE/$BIN" sync
            node "$GITHUB_WORKSPACE/$BIN" drift
          )
      - run: pnpm test
      - run: pnpm typecheck
